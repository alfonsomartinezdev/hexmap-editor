/* Layout: one-screen phone app. Top bar, map fills the middle, bottom stack (selection sheet, draft bar)
   sits in the flow so the map never hides behind it. Desktop is the same column, centered and wider. */
:root{
  /* field notebook: newsprint paper, black marker, a yellow highlighter */
  --bg:#ecebe5; --surface:#f6f5f0; --raise:#ffffff; --fg:#141414; --muted:#4b4a45;
  --line:#141414; --accent:#ffd93b; --accent-ink:#141414; --accent-line:#141414; --sel:rgba(255,217,59,.6);
  --void:#dedcd3; --unmade:#f1f0ea; --grid:#a9a69a; --draft:#e23d28; --danger:#c42b17;
  --shadow:none; --hard:3px 3px 0 var(--line);
  --f-display:"Gaegu", "Comic Neue", "Chalkboard SE", "Marker Felt", cursive;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --wobble:14px 5px 12px 6px / 6px 12px 5px 14px; color-scheme:light;
}
/* the app owns its theme: light unless the player switches dark mode on (data-mode), whatever the
   phone or the page around it prefers */
:root[data-mode="dark"]{
  /* chalk on a slate board */
  --bg:#1d2220; --surface:#252b28; --raise:#2e3531; --fg:#f3f0e6; --muted:#bfc3b9;
  --line:#f3f0e6; --accent:#ffd93b; --accent-ink:#141414; --accent-line:#ffd93b; --sel:rgba(255,217,59,.32);
  --void:#171b19; --unmade:#2a302d; --grid:#56605a; --draft:#ff8a5c; --danger:#ff8a78; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.4;overflow:hidden}
.app{height:100%;width:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto;background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.top h1{font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin:0;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn.age{font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}

.stage{position:relative;min-height:0;background:var(--void);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.selmode{min-height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--line);background:var(--raise);font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap}
.selmode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:1.3rem;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.zbtn.small{font-size:.8rem}
.banner{position:absolute;left:10px;right:10px;top:64px;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 8px 8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.banner span{flex:1;min-width:0}
.banner button{min-height:40px;padding:0 12px;border-radius:8px;border:0;background:var(--bg);color:var(--fg);font-weight:700;cursor:pointer}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 140px);text-align:center;pointer-events:none;transition:opacity .2s}

.menubtn{position:absolute;left:10px;top:10px;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 14px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-size:.9rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:calc(100% - 190px)}
.menubtn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.showbox{position:absolute;right:10px;top:10px;display:flex;gap:6px;max-width:180px}
.showbtn{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-size:.9rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);min-width:0}
.showbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.showbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.showoff{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-size:1rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.burger{display:flex;flex-direction:column;gap:3px;flex:0 0 18px}
.burger i{display:block;height:2px;border-radius:1px;background:currentColor}
.hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:8px}
.rowbtn{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);text-align:left;cursor:pointer;width:100%}
.rowbtn:disabled{cursor:default;opacity:.55}
.rowbtn .rl{flex:0 0 7.6em;white-space:nowrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rowbtn .rv{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.rowbtn .rv canvas{width:26px;height:26px;border-radius:6px;flex:0 0 26px}
.rowbtn .rv .none{font-weight:400;color:var(--muted)}
.rowbtn .chev{color:var(--muted);font-size:1.3rem;line-height:1}
.rowgap{min-height:56px}
.bottom{min-width:0;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{min-width:0;max-height:52vh;overflow-y:auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;background:var(--raise)}
.step{min-width:44px;min-height:44px;border:0;background:none;font-size:1.4rem;font-weight:700;cursor:pointer;border-radius:12px}
.step:disabled{opacity:.35;cursor:default}
.step.deselect{border:1px solid var(--line);background:var(--raise);font-size:1.05rem;flex:0 0 44px}
.count{font-weight:700;font-size:.95rem;white-space:nowrap;padding:0 4px;font-variant-numeric:tabular-nums}
.sheet > .shead{position:sticky;top:-12px;z-index:2;background:var(--surface);margin:-12px -16px 0;padding:12px 16px 8px}
.shead h2{margin:0;font-size:1.05rem;flex:1;min-width:0;overflow-wrap:anywhere}
.stitle{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.stitle h2{flex:0 1 auto}
.coord{font-family:"Space Mono",monospace;font-weight:700;font-size:.8rem;color:var(--muted);white-space:nowrap}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:700;font-size:.95rem;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.warnbox{border:2px solid var(--line);border-radius:10px 14px 12px 9px;background:var(--accent);color:#141414;padding:10px 12px;font-weight:700;margin:4px 0 8px}
.btn:disabled{opacity:.5;cursor:default}
.sfoot{position:sticky;bottom:0;margin:0 -16px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sfoot .what{flex:1;min-width:0;color:var(--muted);font-size:.9rem}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.cats{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}}
.cat{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:8px}

<script>
(() => {
/* ================= data ================= */
const LAND = [ // broad terrain that fits any world; anything else is a custom land. Each has its own pen stroke.
  ["desert","Desert","#dcc58a","dots"],["forest","Forest","#4a7a45","cross"],["hills","Hills","#b09a63","humps"],
  ["mountains","Mountains","#82796e","zigzag"],["grassland","Plains","#a9bb6c","lines"],["sea","Water","#2f5d86","waves"],
  ["swamp","Wetland","#61714d","dashes"]
];
// retired defaults: still drawn if already on the map, no longer offered
const RETIRED = [["shallows","Shallows","#5f97bb","waves"],["river","River","#6aa6cf","waves"],["glacier","Glacier","#e3edf3","rows"],
  ["lake","Lake","#4a8cbc","waves"],["jungle","Rainforest","#2d6a4f","cross"],["volcano","Volcano","#7a3b33","back"],
  ["tundra","Tundra","#b8c4ba","dashes"]];
// the hatching a land is drawn with; land identity is color + pen, no symbol
const PENS = [["lines","Lines"],["back","Back lines"],["cross","Crosshatch"],["zigzag","Zigzag"],["humps","Humps"],["waves","Waves"],
  ["vertical","Upright"],["rows","Rows"],["dots","Dots"],["dashes","Dashes"],["bricks","Bricks"]];
const PEN_ALIAS = {peaks:"zigzag", hills:"humps", scallops:"humps", trees:"cross", grass:"lines", reeds:"dashes"};   // pens tried in earlier previews
const PEN_KEYS = PENS.map(x => x[0]);
// custom lands made before pens existed had a symbol; give them the nearest pen
const GLYPH_PEN = {waves:"waves", ripple:"waves", river:"waves", grass:"lines", canopy:"cross", canopies:"cross", tree:"cross", trees:"cross",
  tuft:"dashes", hill:"humps", peak:"zigzag", dots:"dots", dash:"rows", flake:"bricks", cone:"back"};
// symbols a custom nature can use (the old land symbols, freed up)
const GLYPHS = [["waves","Waves"],["ripple","Ripple"],["grass","Grass"],["canopy","Tree"],["canopies","Trees"],["tuft","Reeds"],
  ["hill","Hill"],["peak","Peak"],["dots","Sand"],["dash","Frost"],["flake","Flake"],["cone","Volcano"]];
const LAND_COLORS = [["Deep blue","#2f5d86"],["Blue","#4a8cbc"],["Teal","#2f8a7e"],["Green","#4a7a45"],["Dark green","#2d6a4f"],["Olive","#61714d"],
  ["Sage","#a9bb6c"],["Sand","#dcc58a"],["Ochre","#b09a63"],["Stone","#82796e"],["Rust","#7a3b33"],["Frost","#b8c4ba"],["Snow","#e3edf3"],["Ash","#4b4f58"],["Violet","#6e5a8f"],["Rose","#b5677a"]];
function penFor(def){                                    // a custom land's pen: chosen, else from its old symbol, else from its name
  if (def.pen && PEN_KEYS.includes(def.pen)) return def.pen;
  if (def.pen && PEN_ALIAS[def.pen]) return PEN_ALIAS[def.pen];
  if (def.glyph && GLYPH_PEN[def.glyph]) return GLYPH_PEN[def.glyph];
  let h = 0; for (const ch of (def.name||"") + (def.color||"")) h = (h*31 + ch.charCodeAt(0)) >>> 0; return PEN_KEYS[h % PEN_KEYS.length]; }
const RIVER_BLUE = "#3f8fd0";
const NATURES = [
  ["Baneful","Something in this land does harm to whatever stays"],["Burning","Something in this land is on fire"],
  ["Carved","Something in this land looks made"],["Deep","This land goes further down than up"],
  ["Fading","Everything in this land is thin on the ground"],["Faithful","This land keeps its word and makes good what goes wrong"],
  ["Frozen","Something in this land never thaws"],["Hungry","Something in this land is always taking"],
  ["Lavish","This land gives more than anything on it could use"],["Quickening","Something in this land brings things to life"],
  ["Radiant","This land is bright"],["Roaring","This land is never quiet"],["Skyward","This land goes further up than down"],
  ["Still","Nothing in this land moves, and nothing makes a sound"],["Tangled","Nothing in this land runs straight"],
  ["Teeming","This land is full of living things"],["Veiled","This land is concealed or covered in something"],
  ["Wild","Nothing in this land has ever been tamed, and no two years of it are alike"]
];
// each nature is drawn in ink with its own little symbol
const NAT_GLYPH = {Baneful:"skull", Burning:"flame", Carved:"block", Deep:"down", Fading:"fade", Faithful:"rings", Frozen:"snow",
  Hungry:"jaws", Lavish:"bowl", Quickening:"sprout", Radiant:"sun", Roaring:"roar", Skyward:"up", Still:"pause", Tangled:"tangle",
  Teeming:"swarm", Veiled:"eyelid", Wild:"spiral"};
const MARKERS = {legend:["Dot","dot"], city:["Star","star"], army:["Square","square"], wonder:["Diamond","diamond"],
  tri:["Triangle","tri"], ring:["Ring","ring"], cross:["Cross","cross"], moon:["Crescent","moon"], flag:["Flag","flag"]}; // meaning is up to the players
const PALETTE = [["Crimson","#c8323c"],["Amber","#e0912f"],["Gold","#e6c440"],["Leaf","#4caf50"],["Teal","#1fa39a"],["Sky","#3d9be0"],
  ["Indigo","#4b56c8"],["Violet","#8e4fc8"],["Rose","#e05f9c"],["Umber","#8a5a3b"],["Slate","#5f6b7a"],["Bone","#efe6d2"]];
const AGES = {1:["First Age",19],2:["Second Age",7],3:["Third Age",1]};

let COLS = 32, ROWS = 53, age = 1;
let posts = [];                 // saved posts, sorted by id (= time order)
let base = new Map();           // the world now: fold of all posts
const draft = new Map();        // hexId -> patch, private until saved
const selection = new Set();
let histIdx = null, histState = null;
const customLand = new Map();   // key "x-<id>" -> {name,color}
const customNat = new Map();    // name -> symbol
const peoples = new Map();      // id -> {name,color}
const undoStack = [];
let hinted = false;
try { hinted = localStorage.getItem("soc-hinted") === "1"; } catch(e){}
let selectMode = false, moveState = null, sheetCat = null, sheetForm = null, focusHex = null;
let db = null, user = null, myId = null, canWrite = true;
let backend = null;                                  // where posts live: claude, firebase or local
let draftDefs = {types:{}, peoples:{}};              // new lands, natures and peoples, published with the next post
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, v); } catch(e){} };
let deviceId = lsGet("soc-device"); if (!deviceId){ deviceId = "d_" + Math.random().toString(36).slice(2,12); lsSet("soc-device", deviceId); }
const myName = () => (lsGet("soc-name") || "").trim();
const names = new Map();        // user id -> display name

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hid = (c,r) => `h${c}_${r}`;
const parse = id => id.slice(1).split("_").map(Number);
const rid = () => Math.random().toString(36).slice(2,10);

function landInfo(t){
  if (!t) return null;
  const b = LAND.find(l => l[0]===t) || RETIRED.find(l => l[0]===t); if (b) return {name:b[1], color:b[2], pen:b[3]};
  const c = customLand.get(t); if (c) return {name:c.name, color:c.color, pen:penFor(c), glyph:c.glyph};
  return {name:"Other land", color:"#8f8a82", pen:"lines"};
}
function merge(a, p){
  if (!p) return a || null;
  const o = {...(a||{})};
  for (const [k,v] of Object.entries(p)){ if (v===null || v===false || (Array.isArray(v) && !v.length)) delete o[k]; else o[k]=v; }
  return Object.keys(o).length ? o : null;
}
function fold(list){
  const m = new Map();
  for (const p of list) for (const [id,patch] of Object.entries(p.changes||{})){ const v = merge(m.get(id), patch); if (v) m.set(id,v); else m.delete(id); }
  return m;
}
// posts sort by server time, then id
const byTime = (a,b) => ((a.at||0) - (b.at||0)) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
// a cleared field is sent as false: Firebase would silently drop null or []

  const out = {};

/* ================= geometry ================= */
const S = 10, SQ3 = Math.sqrt(3);

function pick(wx, wy){
  const px = wx - SQ3*S/2, py = wy - S;
  const q = (SQ3/3*px - py/3)/S, r = (2/3*py)/S;
  let x=q, z=r, y=-x-z, rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
  const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
  if (dx>dy && dx>dz) rx=-ry-rz; else if (dy>dz) ry=-rx-rz; else rz=-rx-ry;
  const c = rx + (rz - (rz&1))/2;
  return inB(c,rz) ? [c,rz] : null;
}
function edgeNeighbors(c,r){ // order matches edges E, SE, SW, W, NW, NE
  const o = r&1;
  return [[c+1,r],[c+o,r+1],[c-1+o,r+1],[c-1,r],[c-1+o,r-1],[c+o,r-1]];
}

/* ================= view ================= */
const canvas = $("map"), ctx = canvas.getContext("2d"), stage = $("stage");
const V = {k:1, ox:0, oy:0}; let W=0, H=0, DPR=1, fitK=1;
function resize(){

  const first = !W, oldW = W, oldH = H; W=b.width; H=b.height;
  // the sheet opening or closing changes the height: keep the map where it is and let the sheet cover the bottom
  if (!first){ V.ox += (W-oldW)/2; }
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  if (first) fit(); else { if (reveal){ ensureVisible(...parse(reveal)); } }

}
function fit(){
  fitK = Math.min((W-16)/worldW(), (H-16)/worldH());

const hexPx = () => SQ3*S*V.k;
// keep the map on screen: it can be dragged until about this much empty page shows at an edge

  const m = 80, top = 110, wW = worldW()*V.k, wH = worldH()*V.k;
  const span = (a, b, v) => Math.min(Math.max(v, Math.min(a, b)), Math.max(a, b));
  V.ox = span(W - wW - m, m, V.ox);

function zoomAt(f, sx, sy){
  const k2 = Math.min(Math.max(V.k*f, fitK*0.8), 130/(SQ3*S));
  V.ox = sx - (sx-V.ox)*k2/V.k; V.oy = sy - (sy-V.oy)*k2/V.k; V.k = k2; draw();
}
const toWorld = (sx,sy) => [(sx-V.ox)/V.k, (sy-V.oy)/V.k];

  for (const [k,v] of customLand) types[k.slice(2)] = {kind:"land", name:v.name, color:v.color, pen:penFor(v)};
  for (const [nm,g] of customNat) types["n" + rid()] = g ? {kind:"nature", name:nm, glyph:g} : {kind:"nature", name:nm};

  if (Object.keys(types).length) post.types = types;

  return post;

/* ================= rules: a small Markdown reader for rules.md ================= */
function mdInline(t){
  const esc = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return esc.replace(/\\([*_`\\])/g, (m,c) => `&#${c.charCodeAt(0)};`)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\s][^*]*)\*/g, "<em>$1</em>");
}
function renderMarkdown(md){
  const lines = md.replace(/\r/g,"").split("\n"), out = [], heads = [];
  const cells = l => l.trim().replace(/^\||\|$/g,"").split("|").map(c => c.trim());
  let i = 0, para = [];
  const flush = () => { if (para.length){ out.push(`<p>${mdInline(para.join(" "))}</p>`); para = []; } };
  while (i < lines.length){
    const l = lines[i];
    let m;
    if (!l.trim()){ flush(); i++; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))){
      flush(); const lvl = m[1].length + 1, text = m[2].trim(), id = "r-" + text.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      if (lvl === 3) heads.push([id, text]);
      out.push(`<h${lvl} id="${id}">${mdInline(text)}</h${lvl}>`); i++; continue;
    }
    if (l.trim().startsWith("|") && lines[i+1] && /^\s*\|?\s*:?-{3,}/.test(lines[i+1])){
      flush(); const head = cells(l), align = cells(lines[i+1]).map(a => /^:.*:$/.test(a) ? ' class="c"' : ""); i += 2;
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")){ const r = cells(lines[i]); if (r.some(Boolean)) rows.push(r); i++; }
      out.push(`<div class="tablewrap"><table><thead><tr>${head.map((h,k) => `<th${align[k]||""}>${mdInline(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c,k) => `<td${align[k]||""}>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if ((m = l.match(/^\s*(\d+\.|[-*])\s+(.*)$/))){
      flush(); const ordered = /\d/.test(m[1]), items = [];
      while (i < lines.length && (m = lines[i].match(/^\s*(\d+\.|[-*])\s+(.*)$/))){ items.push(m[2]); i++; while (i < lines.length && lines[i].trim() && !/^\s*(\d+\.|[-*])\s+/.test(lines[i]) && !/^#|^\|/.test(lines[i].trim())){ items[items.length-1] += " " + lines[i].trim(); i++; } }
      out.push(`<${ordered?"ol":"ul"}>${items.map(t => `<li>${mdInline(t)}</li>`).join("")}</${ordered?"ol":"ul"}>`); continue;
    }
    para.push(l.trim()); i++;
  }
  flush();
  return { html: out.join("\n"), heads };
}

// the map being shown changed (someone cleared it, or this device was on an older map):
// drop what belonged to the old one, including this device's unpublished changes
let mapId;
function onMap(id){
  id = id || "";
  if (mapId === id) return;
  const first = mapId === undefined; mapId = id;
  const was = lsGet("soc-map");
  lsSet("soc-map", id);
  if (first && (was === null || was === id)) return;            // same map as last time: keep the draft
  const lost = draft.size;
  draft.clear(); draftDefs = {types:{}, peoples:{}}; undoStack.length = 0; saveDraftLocal();
  posts = []; base = new Map(); customLand.clear(); customNat.clear(); peoples.clear(); age = 1;
  if (histIdx !== null) showHistory(null);
  if (highlight) setHighlight(null);
  clearSelection(); renderAge(); renderDraftBar(); draw();
  if (!first) toast(lost ? "The map was cleared. Your unpublished changes were dropped." : "The map was cleared.");
  else if (lost) toast("The map was cleared while you were away. Your unpublished changes were dropped.");
}
// every backend does two things: stream all posts, and add one
function onPosts(list){
  const pc = COLS, pr = ROWS;
  posts = list.slice().sort(byTime);
  applyDefs(posts); applyDefs([draftDefs]); renderAge();
  if (COLS !== pc || ROWS !== pr) fit();
  base = fold(posts);
  if (highlight){ const p = players().find(x => x.key === highlight.key); if (p){ highlight.set = p.set; highlight.label = p.label; } }
  // drop draft fields that now match the shared map
  for (const [id,p] of [...draft]){ const b = base.get(id)||{}; for (const k of Object.keys(p)) if (same(b[k], p[k])) delete p[k]; if (!Object.keys(p).length) draft.delete(id); }
  if (histIdx !== null){ if (histIdx >= posts.length) showHistory(null); else histState = fold(posts.slice(0,histIdx+1)); }
  renderDraftBar(); renderSheet(); draw();
}

// Firebase Realtime Database over plain REST: a live stream to read, a PUT to add a post
// Firebase Realtime Database over plain REST: a live stream to read, a PUT to add a post.
// /current says which map is live; its posts are at /maps/<id>/posts. The first map's posts are at /posts.
function firebaseBackend(cfg){
  const root = cfg.databaseURL.replace(/\/$/, "");
  let active = null, postsES = null, maps = false;
  const postsPath = () => active ? `/maps/${encodeURIComponent(active)}/posts` : "/posts";
  function follow(id){
    if (postsES && active === (id || null)) return;
    if (postsES) postsES.close();
    active = id || null; onMap(active);
    const all = new Map(), mine = {}; let warned = false;
    const emit = () => { if (postsES !== mine.es) return; warned = false; onPosts([...all].map(([id,v]) => ({...v, id}))); };
    const es = mine.es = postsES = new EventSource(root + postsPath() + ".json");
    es.addEventListener("put", e => {
      const {path, data} = JSON.parse(e.data), parts = path.split("/").filter(Boolean);
      if (!parts.length){ all.clear(); for (const [k,v] of Object.entries(data || {})) all.set(k, v); }
      else if (parts.length === 1){ if (data === null) all.delete(parts[0]); else all.set(parts[0], data); }
      else { const cur = all.get(parts[0]) || {}; let o = cur; for (const k of parts.slice(1,-1)) o = o[k] = o[k] || {}; o[parts.at(-1)] = data; all.set(parts[0], cur); }
      emit();
    });
    es.addEventListener("patch", e => {
      const {path, data} = JSON.parse(e.data), parts = path.split("/").filter(Boolean);
      if (!parts.length) for (const [k,v] of Object.entries(data || {})) all.set(k, v);
      else all.set(parts[0], Object.assign(all.get(parts[0]) || {}, data));
      emit();
    });
    es.onerror = () => { if (!warned){ warned = true; toast("Reconnecting to the map…"); } };
  }
  const put = (path, body) => fetch(root + path + ".json", { method:"PUT", headers:{"content-type":"application/json"}, body: JSON.stringify({...body, at: {".sv":"timestamp"}}) });
  const be = {
    kind:"firebase", needsName:true,
    async start(){
      // databases set up before maps existed can't read /current: keep using /posts and offer no clearing
      let r = null; try { r = await fetch(root + "/current.json"); } catch(e){}
      if (!r || !r.ok){ follow(null); return; }
      maps = true;
      const cur = new EventSource(root + "/current.json");
      cur.addEventListener("put", e => { const {path, data} = JSON.parse(e.data); if (path === "/") follow(data && data.map); else if (path === "/map") follow(data); });
      cur.addEventListener("patch", e => { const {data} = JSON.parse(e.data); if (data && "map" in data) follow(data.map); });
    },
    async publish(post){
      const {id, ...body} = post;
      const r = await put(`${postsPath()}/${encodeURIComponent(id)}`, body);
      if (!r.ok) throw new Error("publish failed: " + r.status);
    },
    async newMap(seed){
      if (!maps) throw {code:"rules"};
      const map = "m" + Date.now().toString(36) + rid().slice(0,4), {id, ...body} = seed;
      let r = await put(`/maps/${map}/posts/${encodeURIComponent(id)}`, body);
      if (!r.ok) throw r.status === 401 ? {code:"rules"} : new Error("seed failed");
      r = await put("/current", { map, by: seed.by });
      if (!r.ok) throw r.status === 401 ? {code:"rules"} : new Error("switch failed");
    }
  };
  return be;
}
async function claudeBackend(cl){
  const [d, u] = await Promise.all([cl.use("db"), cl.use("user")]);
  user = u;
  if (u){ try { myId = await u.id(); } catch(e){} try { if (await u.can("data.write") === false) setReadOnly(); } catch(e){} }
  if (!d) return null;
  db = d;
  return {
    kind:"claude", needsName:false,
    start(){
      // world/current says which map is live; the first map's posts are the "posts" collection
      let stop = null, active;
      const follow = id => {
        id = id || null; if (active === id) return; active = id;
        if (typeof stop === "function") stop();
        onMap(id); const col = id ? `maps/${id}/posts` : "posts";
        stop = db.collection(col).onSnapshot(snap => { if (active === id) onPosts(snap.docs.map(x => ({id:x.id, ...x.data()}))); }, () => toast("Lost connection. Reload to see new posts."));
      };
      this.path = () => active ? `maps/${active}/posts` : "posts";
      db.doc("world/current").onSnapshot(s => follow(s.exists ? s.data().map : null));
      // older copies kept lands, peoples and the age outside posts
      db.collection("types").onSnapshot(snap => { applyDefs([{types: Object.fromEntries(snap.docs.map(x => [x.id, x.data()]))}]); draw(); if (sheetCat) renderSheet(); });
      db.collection("peoples").onSnapshot(snap => { applyDefs([{peoples: Object.fromEntries(snap.docs.map(x => [x.id, x.data()]))}]); draw(); if (sheetCat) renderSheet(); });
      db.doc("world/meta").onSnapshot(s => { if (s.exists){ applyDefs([{world: s.data()}]); applyDefs(posts.filter(p => p.world)); renderAge(); fit(); } });
    },
    async publish(post){ const {id, ...body} = post; await db.doc((this.path ? this.path() : "posts") + "/" + id).set({...body, at: Date.now()}); },
    async newMap(seed){
      const map = "m" + Date.now().toString(36) + rid().slice(0,4), {id, ...body} = seed;
      await db.doc(`maps/${map}/posts/${id}`).set({...body, at: Date.now()});
      await db.doc("world/current").set({ map, by: seed.by, at: Date.now() });
    }
  };
}
(async () => {
  const cl = window.claude, cfg = window.MAP_CONFIG;
  if (cl && cl.use) backend = await claudeBackend(cl);
  if (!backend && cfg && cfg.databaseURL) backend = firebaseBackend(cfg);
  if (!backend) backend = localBackend();
