<title>Songs of Creation World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen phone app. Top bar, map fills the middle, bottom stack (selection sheet, draft bar)
   sits in the flow so the map never hides behind it. Desktop is the same column, centered and wider. */
:root{
  --bg:#e4e8ee; --surface:#f7f8fa; --raise:#ffffff; --fg:#151a24; --muted:#4f596b;
  --line:#c3cad6; --accent:#2c4a9a; --accent-ink:#ffffff; --sel:rgba(44,74,154,.38);
  --void:#cfd6e0; --unmade:#eef1f5; --grid:#b4bdcb; --draft:#b4610f; --danger:#a1311f;
  --shadow:0 -4px 20px rgba(21,26,36,.12);
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e121d; --surface:#161b28; --raise:#1f2535; --fg:#eceff5; --muted:#a6afc2;
  --line:#2f3850; --accent:#a9bdf2; --accent-ink:#0e121d; --sel:rgba(169,189,242,.4);
  --void:#0a0d16; --unmade:#1b2132; --grid:#2c3550; --draft:#f0a35a; --danger:#f08a78;
  --shadow:0 -4px 20px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e121d; --surface:#161b28; --raise:#1f2535; --fg:#eceff5; --muted:#a6afc2;
  --line:#2f3850; --accent:#a9bdf2; --accent-ink:#0e121d; --sel:rgba(169,189,242,.4);
  --void:#0a0d16; --unmade:#1b2132; --grid:#2c3550; --draft:#f0a35a; --danger:#f08a78;
  --shadow:0 -4px 20px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.4;overflow:hidden}
.app{height:100%;width:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto;background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.top h1{font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin:0;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn.age{font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}

.stage{position:relative;min-height:0;background:var(--void);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.selmode{min-height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--line);background:var(--raise);font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap}
.selmode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:1.3rem;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.zbtn.small{font-size:.8rem}
.banner{position:absolute;left:10px;right:10px;top:64px;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 8px 8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.banner span{flex:1;min-width:0}
.banner button{min-height:40px;padding:0 12px;border-radius:8px;border:0;background:var(--bg);color:var(--fg);font-weight:700;cursor:pointer}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 140px);text-align:center;pointer-events:none;transition:opacity .2s}

.menubtn{position:absolute;left:10px;top:10px;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 14px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-size:.9rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:calc(100% - 84px)}
.menubtn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:flex;flex-direction:column;gap:3px;flex:0 0 18px}
.burger i{display:block;height:2px;border-radius:1px;background:currentColor}
.hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:8px}
.rowbtn{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);text-align:left;cursor:pointer;width:100%}
.rowbtn:disabled{cursor:default;opacity:.55}
.rowbtn .rl{flex:0 0 7.6em;white-space:nowrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rowbtn .rv{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.rowbtn .rv canvas{width:26px;height:26px;border-radius:6px;flex:0 0 26px}
.rowbtn .rv .none{font-weight:400;color:var(--muted)}
.rowbtn .chev{color:var(--muted);font-size:1.3rem;line-height:1}
.rowgap{min-height:56px}
.bottom{min-width:0;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{min-width:0;max-height:52vh;overflow-y:auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;background:var(--raise)}
.step{min-width:44px;min-height:44px;border:0;background:none;font-size:1.4rem;font-weight:700;cursor:pointer;border-radius:12px}
.step:disabled{opacity:.35;cursor:default}
.count{font-weight:700;font-size:.95rem;white-space:nowrap;padding:0 4px;font-variant-numeric:tabular-nums}
.shead h2{margin:0;font-size:1.05rem;flex:1;min-width:0;overflow-wrap:anywhere}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:700;font-size:.95rem;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.sfoot{position:sticky;bottom:0;margin:0 -16px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sfoot .what{flex:1;min-width:0;color:var(--muted);font-size:.9rem}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.cats{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}}
.cat{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:8px}
.opt{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--raise);display:flex;align-items:center;gap:10px;padding:0 10px;cursor:pointer;text-align:left;font-size:.95rem}
.opt canvas,.keyrow canvas{width:28px;height:28px;flex:0 0 28px;border-radius:6px}
.opt .sw,.keyrow .sw{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid var(--fg)}
.opt.other{border-style:dashed;color:var(--muted)}
.sub{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.details{display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 4px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:.9rem}
.chip button{min-width:32px;min-height:32px;border:0;background:none;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.mk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mk{padding-bottom:10px;border-bottom:1px solid var(--line)}
.mk .name{flex:1 1 100%;min-width:0;display:flex;align-items:center;gap:8px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-weight:700;font-size:.9rem}
.form input{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--fg);font:inherit;padding:0 12px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swb[aria-pressed="true"]{border:3px solid var(--fg);box-shadow:0 0 0 3px var(--surface) inset}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.movebar{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.movebar span{flex:1;min-width:0}
.movebar button{min-height:40px;padding:0 12px;border-radius:8px;border:0;background:var(--bg);color:var(--fg);font-weight:700;cursor:pointer}

.draftbar{min-width:0;display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.draftbar .what{flex:1 1 100%;min-width:0;font-weight:700;font-size:.9rem}
.draftbar .what small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--draft);margin-right:6px;vertical-align:middle}

.modal{position:fixed;inset:0;background:rgba(10,13,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mpanel{background:var(--surface);width:100%;max-width:760px;max-height:86%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;flex:1;font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.mbody{overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px}
.keyrow{display:flex;align-items:center;gap:10px;min-height:40px}
.keylist{display:flex;flex-direction:column;gap:2px}
.keyrow button{all:unset}
.link{min-height:44px;display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;padding:0 2px}
.link .when{color:var(--muted);font-size:.85rem;margin-left:auto;white-space:nowrap}
.empty{color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segs .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{color:var(--muted);font-size:.9rem;margin:0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="map" tabindex="0" role="application" aria-roledescription="hex map" aria-label="World map. Arrow keys move between hexes. Enter selects a hex, Space adds it to the selection, Escape clears."></canvas>
    <button class="menubtn" id="menuBtn" aria-haspopup="dialog"><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span><span id="ageLabel">First Age · area 19</span></button>
    <div class="hint" id="hint" hidden aria-hidden="true"></div>
    <div class="zoom">
      <button class="zbtn" id="zin" aria-label="Zoom in">+</button>
      <button class="zbtn" id="zout" aria-label="Zoom out">−</button>
      <button class="zbtn small" id="zfit" aria-label="Fit whole map">Fit</button>
    </div>
    <div class="banner" id="histBanner" hidden><span id="histText"></span><button id="histBack">Back to now</button></div>
    <div class="toast" id="toast" style="opacity:0" aria-hidden="true"></div>
    <div class="sr" id="live" aria-live="polite"></div>
  </main>
  <div class="bottom" id="bottom">
    <section class="sheet" id="sheet" hidden aria-label="Selected hexes"></section>
    <div class="draftbar" id="draftBar" hidden></div>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <div class="mpanel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead"><h2 id="mTitle"></h2><button class="btn quiet" id="mClose">Close</button></div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<script>
(() => {
/* ================= data ================= */
const LAND = [ // broad terrain that fits any world; anything else is a custom land
  ["desert","Desert","#dcc58a","dots"],["forest","Forest","#4a7a45","canopy"],["hills","Hills","#b09a63","hill"],
  ["mountains","Mountains","#82796e","peak"],["grassland","Plains","#a9bb6c","grass"],["sea","Water","#2f5d86","waves"],
  ["swamp","Wetland","#61714d","tuft"]
];
// retired defaults: still drawn if already on the map, no longer offered
const RETIRED = [["shallows","Shallows","#5f97bb","ripple"],["river","River","#6aa6cf","river"],["glacier","Glacier","#e3edf3","flake"],
  ["lake","Lake","#4a8cbc","ripple"],["jungle","Rainforest","#2d6a4f","canopies"],["volcano","Volcano","#7a3b33","cone"],
  ["tundra","Tundra","#b8c4ba","dash"]];
// symbols a custom land can use
const GLYPHS = [["waves","Waves"],["ripple","Ripple"],["grass","Grass"],["canopy","Tree"],["canopies","Trees"],["tuft","Reeds"],
  ["hill","Hill"],["peak","Peak"],["dots","Sand"],["dash","Frost"],["flake","Flake"],["cone","Volcano"]];
const LAND_COLORS = [["Deep blue","#2f5d86"],["Blue","#4a8cbc"],["Teal","#2f8a7e"],["Green","#4a7a45"],["Dark green","#2d6a4f"],["Olive","#61714d"],
  ["Sage","#a9bb6c"],["Sand","#dcc58a"],["Ochre","#b09a63"],["Stone","#82796e"],["Rust","#7a3b33"],["Frost","#b8c4ba"],["Snow","#e3edf3"],["Ash","#4b4f58"],["Violet","#6e5a8f"],["Rose","#b5677a"]];
const RIVER_BLUE = "#3f8fd0";
const NATURES = [
  ["Baneful","Something in this land does harm to whatever stays"],["Burning","Something in this land is on fire"],
  ["Carved","Something in this land looks made"],["Deep","This land goes further down than up"],
  ["Fading","Everything in this land is thin on the ground"],["Faithful","This land keeps its word and makes good what goes wrong"],
  ["Frozen","Something in this land never thaws"],["Hungry","Something in this land is always taking"],
  ["Lavish","This land gives more than anything on it could use"],["Quickening","Something in this land brings things to life"],
  ["Radiant","This land is bright"],["Roaring","This land is never quiet"],["Skyward","This land goes further up than down"],
  ["Still","Nothing in this land moves, and nothing makes a sound"],["Tangled","Nothing in this land runs straight"],
  ["Teeming","This land is full of living things"],["Veiled","This land is concealed or covered in something"],
  ["Wild","Nothing in this land has ever been tamed, and no two years of it are alike"]
];
const MARKERS = {legend:["Dot","dot"], city:["Star","star"], army:["Square","square"], wonder:["Diamond","diamond"],
  tri:["Triangle","tri"], ring:["Ring","ring"], cross:["Cross","cross"], moon:["Crescent","moon"], flag:["Flag","flag"]}; // meaning is up to the players
const PALETTE = [["Crimson","#c8323c"],["Amber","#e0912f"],["Gold","#e6c440"],["Leaf","#4caf50"],["Teal","#1fa39a"],["Sky","#3d9be0"],
  ["Indigo","#4b56c8"],["Violet","#8e4fc8"],["Rose","#e05f9c"],["Umber","#8a5a3b"],["Slate","#5f6b7a"],["Bone","#efe6d2"]];
const AGES = {1:["First Age",19],2:["Second Age",7],3:["Third Age",1]};

let COLS = 32, ROWS = 53, age = 1;
let posts = [];                 // saved posts, sorted by id (= time order)
let base = new Map();           // the world now: fold of all posts
const draft = new Map();        // hexId -> patch, private until saved
const selection = new Set();
let histIdx = null, histState = null;
const customLand = new Map();   // key "x-<id>" -> {name,color}
const customNat = new Set();
const peoples = new Map();      // id -> {name,color}
const undoStack = [];
let hinted = false;
try { hinted = localStorage.getItem("soc-hinted") === "1"; } catch(e){}
let selectMode = false, moveState = null, sheetCat = null, sheetForm = null, focusHex = null;
let db = null, user = null, myId = null, canWrite = true;
const names = new Map();        // user id -> display name

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hid = (c,r) => `h${c}_${r}`;
const parse = id => id.slice(1).split("_").map(Number);
const rid = () => Math.random().toString(36).slice(2,10);

function landInfo(t){
  if (!t) return null;
  const b = LAND.find(l => l[0]===t) || RETIRED.find(l => l[0]===t); if (b) return {name:b[1], color:b[2], glyph:b[3]};
  const c = customLand.get(t); if (c) return {name:c.name, color:c.color, glyph:c.glyph || "letter"};
  return {name:"Other land", color:"#8f8a82", glyph:"letter"};
}
function merge(a, p){
  if (!p) return a || null;
  const o = {...(a||{})};
  for (const [k,v] of Object.entries(p)){ if (v===null || (Array.isArray(v) && !v.length)) delete o[k]; else o[k]=v; }
  return Object.keys(o).length ? o : null;
}
function fold(list){
  const m = new Map();
  for (const p of list) for (const [id,patch] of Object.entries(p.changes||{})){ const v = merge(m.get(id), patch); if (v) m.set(id,v); else m.delete(id); }
  return m;
}
const same = (a,b) => JSON.stringify(a??null) === JSON.stringify(b??null);
function view(id){ return histIdx!==null ? (histState.get(id)||null) : merge(base.get(id), draft.get(id)); }
function setField(id, field, value){
  if (Array.isArray(value) && !value.length) value = null;
  const b = base.get(id) || {}, p = {...(draft.get(id)||{})};
  if (same(b[field], value)) delete p[field]; else p[field] = value;
  if (Object.keys(p).length) draft.set(id,p); else draft.delete(id);
}
function snapshot(){ undoStack.push(JSON.stringify([...draft])); if (undoStack.length > 60) undoStack.shift(); }
function undo(){
  if (!undoStack.length) return;
  const prev = JSON.parse(undoStack.pop()); draft.clear(); for (const [k,v] of prev) draft.set(k,v);
  sheetForm = null; afterEdit(); toast("Undone."); say("Undone.");
}
function afterEdit(){ saveDraftLocal(); renderDraftBar(); renderSheet(); draw(); }

/* ================= geometry ================= */
const S = 10, SQ3 = Math.sqrt(3);
const inB = (c,r) => c>=0 && r>=0 && c<COLS && r<ROWS;
const center = (c,r) => [SQ3*S*(c+0.5+0.5*(r&1)), S+1.5*S*r];
const worldW = () => SQ3*S*(COLS+0.5), worldH = () => S*(1.5*(ROWS-1)+2);
function pick(wx, wy){
  const px = wx - SQ3*S/2, py = wy - S;
  const q = (SQ3/3*px - py/3)/S, r = (2/3*py)/S;
  let x=q, z=r, y=-x-z, rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
  const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
  if (dx>dy && dx>dz) rx=-ry-rz; else if (dy>dz) ry=-rx-rz; else rz=-rx-ry;
  const c = rx + (rz - (rz&1))/2;
  return inB(c,rz) ? [c,rz] : null;
}
function edgeNeighbors(c,r){ // order matches edges E, SE, SW, W, NW, NE
  const o = r&1;
  return [[c+1,r],[c+o,r+1],[c-1+o,r+1],[c-1,r],[c-1+o,r-1],[c+o,r-1]];
}

/* ================= view ================= */
const canvas = $("map"), ctx = canvas.getContext("2d"), stage = $("stage");
const V = {k:1, ox:0, oy:0}; let W=0, H=0, DPR=1, fitK=1;
function resize(){
  const b = stage.getBoundingClientRect(); DPR = window.devicePixelRatio||1;
  const first = !W, oldW = W, oldH = H; W=b.width; H=b.height;
  if (!first){ V.ox += (W-oldW)/2; V.oy += (H-oldH)/2; }
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  if (first) fit(); else { if (reveal){ ensureVisible(...parse(reveal)); } }
  if (raf){ cancelAnimationFrame(raf); } raf = 0; paint(); // resizing clears the canvas, so repaint now rather than next frame
}
function fit(){
  fitK = Math.min((W-16)/worldW(), (H-16)/worldH());
  V.k = fitK; V.ox = (W - worldW()*V.k)/2; V.oy = (H - worldH()*V.k)/2; draw();
}
const hexPx = () => SQ3*S*V.k;
function zoomAt(f, sx, sy){
  const k2 = Math.min(Math.max(V.k*f, fitK*0.8), 130/(SQ3*S));
  V.ox = sx - (sx-V.ox)*k2/V.k; V.oy = sy - (sy-V.oy)*k2/V.k; V.k = k2; draw();

const toWorld = (sx,sy) => [(sx-V.ox)/V.k, (sy-V.oy)/V.k];
function ensureVisible(c,r){
  const [x,y] = center(c,r), sx = x*V.k+V.ox, sy = y*V.k+V.oy, m = Math.max(60, hexPx());
  if (sx<m) V.ox += m-sx; if (sx>W-m) V.ox -= sx-(W-m);
  if (sy<m) V.oy += m-sy; if (sy>H-m) V.oy -= sy-(H-m);

/* ================= drawing ================= */
let raf = 0; function draw(){ if (!raf) raf = requestAnimationFrame(paint); }
function hexPath(cx,cy,s){ ctx.beginPath(); for (let i=0;i<6;i++){ const a=Math.PI/180*(60*i-30); const x=cx+s*Math.cos(a), y=cy+s*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath(); }

    case "trees": for (const dx of [-u*.6,u*.6]){ C.moveTo(cx+dx,cy-u); C.lineTo(cx+dx+u*.6,cy+u*.6); C.lineTo(cx+dx-u*.6,cy+u*.6); C.closePath(); } C.fill(); break;

    case "peak": C.moveTo(cx-u*1.2,cy+u*.7); C.lineTo(cx-u*.4,cy-u*.7); C.lineTo(cx+u*.1,cy+u*.1); C.lineTo(cx+u*.5,cy-u*.4); C.lineTo(cx+u*1.2,cy+u*.7); C.stroke(); break;
    case "dots": for (const [dx,dy] of [[-u*.7,u*.3],[0,-u*.4],[u*.7,u*.3]]){ C.moveTo(cx+dx+u*.18,cy+dy); C.arc(cx+dx,cy+dy,u*.18,0,Math.PI*2);} C.fill(); break;

function shapePath(C, shape, x, y, r){

    case "diamond": poly([[0,-1],[.8,0],[0,1],[-.8,0]]); break;
    case "tri": poly([[0,-.95],[.92,.7],[-.92,.7]]); break;
    case "ring": C.arc(x,y,r*.85,0,Math.PI*2); C.moveTo(x+r*.42,y); C.arc(x,y,r*.42,0,Math.PI*2,true); break;
    case "cross": { const a=.3, b=.9; poly([[-a,-b],[a,-b],[a,-a],[b,-a],[b,a],[a,a],[a,b],[-a,b],[-a,a],[-b,a],[-b,-a],[-a,-a]]); break; }

function paint(){

  const cells = [];
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const [cx,cy] = center(c,r); if (!vis(cx,cy)) continue;

/* ================= description (text access) ================= */
function describe(c,r){
  const d = view(hid(c,r)), parts = [`Hex ${c+1}, ${r+1}.`];
  if (!d) return parts.concat("Unshaped.").join(" ");
  const L = landInfo(d.t); parts.push(L ? L.name + "." : "No land type.");
  if (d.r) parts.push("River.");
  if (d.n && d.n.length) parts.push("Natures: " + d.n.join(", ") + ".");
  if (d.p && peoples.has(d.p)) parts.push("Settled by " + peoples.get(d.p).name + ".");
  if (d.m && d.m.length) parts.push("Markers: " + d.m.map(m => `${(PALETTE.find(p=>p[1]===m.color)||[""])[0]} ${(MARKERS[m.k]?.[0]||"marker").toLowerCase()}${m.label?" "+m.label:""}`.trim()).join(", ") + ".");
  if (selection.has(hid(c,r))) parts.push("Selected.");
  return parts.join(" ");
}
function say(t){ const l = $("live"); l.textContent = ""; setTimeout(() => l.textContent = t, 30); }

/* ================= pointer input ================= */
const pts = new Map(); let G = null;
const editing = () => histIdx === null && canWrite;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.offsetX, y:e.offsetY});
  if (pts.size === 1){
    G = {type:"pan", sx:e.offsetX, sy:e.offsetY, ox:V.ox, oy:V.oy, moved:false};
    if (editing() && !moveState && e.button === 0){
      const g = G;
      g.hold = setTimeout(() => {               // hold a hex to add it to the selection
        if (G !== g || g.moved || pts.size !== 1 || hexPx() < 30) return;
        const h = pick(...toWorld(g.sx, g.sy)); if (!h) return;
        g.type = "held"; try { navigator.vibrate && navigator.vibrate(12); } catch(err){}
        selectHex(hid(...h), true);
      }, 450);
    }
  } else if (pts.size === 2){
    if (G && G.hold) clearTimeout(G.hold);
    if (G && G.type === "select" && G.touched.length <= 2){ for (const [id,was] of G.touched){ was ? selection.add(id) : selection.delete(id); } renderSheet(); }
    const [a,b] = [...pts.values()];
    G = {type:"pinch", d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, k:V.k, ox:V.ox, oy:V.oy};
    draw();
  }
});
function selectThrough(sx, sy){
  const h = pick(...toWorld(sx,sy)); if (!h) return; const id = hid(...h);
  if (G.last === id) return; G.last = id;
  const was = selection.has(id); G.touched.push([id, was]);
  if (G.mode === "add") selection.add(id); else selection.delete(id);

}
canvas.addEventListener("pointermove", e => {

    if (Math.hypot(e.offsetX-G.sx, e.offsetY-G.sy) < 8) return;
    if (moveState){ G.type = "pan"; }
    else {
      const h0 = pick(...toWorld(G.sx,G.sy));
      G = {type:"select", mode: h0 && selection.has(hid(...h0)) ? "remove" : "add", last:null, touched:[]};
      selectThrough(e.offsetX, e.offsetY);

    const dx = e.offsetX-G.sx, dy = e.offsetY-G.sy; if (Math.abs(dx)+Math.abs(dy) > 6){ G.moved = true; if (G.hold) clearTimeout(G.hold); }
    V.ox = G.ox+dx; V.oy = G.oy+dy; draw();

function endPointer(e){
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (G && G.hold) clearTimeout(G.hold);
  if (G && pts.size === 0){
    if (G.type === "pending") tap(e.offsetX, e.offsetY);
    else if (G.type === "pan" && !G.moved && histIdx === null) tap(e.offsetX, e.offsetY); // view-only players can still look at hexes
    if (G.type === "select") { renderSheet(); const n = selection.size; say(`${n} ${n===1?"hex":"hexes"} selected.`); }

  } else if (pts.size === 1 && G && G.type === "pinch"){

canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("wheel", e => {
  e.preventDefault();

  else { V.ox -= e.deltaX; V.oy -= e.deltaY; draw(); }
}, {passive:false});

function tap(sx, sy){
  const h = pick(...toWorld(sx,sy)); if (!h) return;

    zoomAt(46/hexPx(), sx, sy); toast("Zoomed in. Tap a hex to select it."); return;

let reveal = null;

    if (!selection.size) adding = false;
  } else if (selection.size === 1 && selection.has(id)){
    selection.clear();

function grow(){

  const changes = Object.fromEntries(draft), post = {id: "p" + Date.now().toString(36) + rid().slice(0,4), by: myId || null, at: Date.now(), changes};
  const btn = $("saveBtn"); if (btn) { btn.disabled = true; btn.textContent = "Publishing…"; }
  if (db){
    try { await db.doc("posts/"+post.id).set({by:post.by, at:post.at, changes}); }
    catch(e){ if (btn){ btn.disabled=false; btn.textContent="Publish post"; } toast(e && e.code==="invalid_argument" ? "You can view this map but not change it." : "Couldn't publish. Your changes are kept; try again."); return; }
  } else { posts.push(post); posts.sort((a,b)=>a.id<b.id?-1:1); base = fold(posts); }
  draft.clear(); undoStack.length = 0; saveDraftLocal(); clearSelection(); renderDraftBar(); draw();
  toast("Published. Everyone can see it now."); say("Post published.");
}
function saveDraftLocal(){ try { localStorage.setItem("soc-draft", JSON.stringify([...draft])); } catch(e){} }
function loadDraftLocal(){ try { const v = JSON.parse(localStorage.getItem("soc-draft")||"[]"); for (const [k,p] of v) draft.set(k,p); } catch(e){} }

/* ================= shared lists ================= */
async function addCustom(kind, name, color, glyph){
  const lc = name.toLowerCase();
  if (kind === "land"){
    for (const [k,v] of customLand) if (v.name.toLowerCase() === lc) return k;
    const b = LAND.find(l => l[1].toLowerCase() === lc); if (b) return b[0];
    const id = rid(); customLand.set("x-"+id, {name, color, glyph});
    if (db) try { await db.doc("types/"+id).set({kind, name, color, glyph}); } catch(e){}
    return "x-"+id;
  }
  const b = NATURES.find(n => n[0].toLowerCase() === lc); if (b) return b[0];
  for (const n of customNat) if (n.toLowerCase() === lc) return n;
  customNat.add(name);
  if (db) try { await db.doc("types/"+rid()).set({kind, name}); } catch(e){}
  return name;
}
async function addPeople(name, color){
  for (const [pid,p] of peoples) if (p.name.toLowerCase() === name.toLowerCase()) return pid;
  const pid = rid(); peoples.set(pid, {name, color});
  if (db) try { await db.doc("peoples/"+pid).set({name, color}); } catch(e){}
  return pid;
}

/* ================= modal: key, history, settings ================= */
const modal = $("modal"); let lastFocus = null;
function openModal(title, body){
  $("hint").hidden = true;
  lastFocus = document.activeElement; $("mTitle").textContent = title; const b = $("mBody"); b.textContent = ""; b.append(...[body].flat());
  modal.hidden = false; $("mClose").focus();
}
function closeModal(){ modal.hidden = true; updateHint(); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$("mClose").onclick = closeModal;
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

function openKey(){
  const out = [];
  const usedLand = new Set(), usedNat = new Set(), markers = [];
  const state = histIdx !== null ? histState : base;
  for (const [id,d] of state){ if (d.t) usedLand.add(d.t); for (const n of d.n||[]) usedNat.add(n); for (const m of d.m||[]) markers.push([id,m]); }
  const landList = el("div",{class:"keylist"});
  for (const [k,name] of LAND) landList.append(el("div",{class:"keyrow"}, landIcon(k), name));
  for (const [k,v] of customLand) landList.append(el("div",{class:"keyrow"}, landIcon(k), v.name));
  landList.append(el("div",{class:"keyrow"}, swatch(RIVER_BLUE), "River, drawn as a line over any land"));
  out.push(el("p",{class:"sub"},"Land"), landList);
  const pl = el("div",{class:"keylist"});
  if (peoples.size) for (const [,p] of peoples) pl.append(el("div",{class:"keyrow"}, swatch(p.color), p.name)); else pl.append(el("p",{class:"empty"},"No peoples yet."));
  out.push(el("p",{class:"sub"},"Peoples"), pl);
  const ml = el("div",{class:"keylist"});
  for (const [k,[name]] of Object.entries(MARKERS)) ml.append(el("div",{class:"keyrow"}, markerIcon(k,"#e6c440"), name));
  out.push(el("p",{class:"sub"},"Markers"), el("p",{class:"note"},"Markers have no set meaning. Your group decides what each symbol and color stands for."), ml);
  if (markers.length){
    const list = el("div",{class:"keylist"});
    for (const [id,m] of markers){ const [c,r] = parse(id);
      list.append(el("button",{type:"button", class:"link", onclick:()=>{ closeModal(); if (histIdx===null){ selection.clear(); selection.add(id); renderSheet(); } focusHex=[c,r]; V.k=Math.max(V.k,46/(SQ3*S)); const [x,y]=center(c,r); V.ox=W/2-x*V.k; V.oy=H/2-y*V.k; draw(); }},
        markerIcon(m.k, m.color), `${MARKERS[m.k]?.[0]}${m.label?": "+m.label:""}`, el("span",{class:"when"}, `${c+1}, ${r+1}`))); }
    out.push(el("p",{class:"sub"},"On the map"), list);
  }
  const nl = el("div",{class:"keylist"});
  for (const [nm,desc] of NATURES) nl.append(el("div",{class:"keyrow"}, el("span",{}, el("strong",{}, nm), ` (${nm.slice(0,3)}) · ${desc}.`)));
  for (const nm of customNat) nl.append(el("div",{class:"keyrow"}, el("span",{}, el("strong",{}, nm), ` (${nm.slice(0,3)}) · custom.`)));
  out.push(el("p",{class:"sub"},"Natures (shown by their first three letters when zoomed in)"), nl);
  openModal("Map key", out);
};

function nameOf(id){ return id ? (id === myId ? "You" : (names.get(id) || "A player")) : "A player"; }
async function loadNames(ids){
  if (!user || !user.profiles) return; const need = ids.filter(i => i && !names.has(i)); if (!need.length) return;
  try { const ps = await user.profiles(need); for (const i of need) if (ps && ps[i] && ps[i].name) names.set(i, ps[i].name); } catch(e){}
}
const when = t => new Date(t).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
async function openHistory(){
  await loadNames([...new Set(posts.map(p=>p.by))]);
  const list = el("div",{class:"keylist"});
  if (!posts.length) list.append(el("p",{class:"empty"}, "No posts yet. Saved posts appear here, newest first."));
  for (let i = posts.length-1; i >= 0; i--){
    const p = posts[i], n = Object.keys(p.changes||{}).length;
    list.append(el("button",{type:"button", class:"link", "aria-current": histIdx===i ? "true" : null, onclick:()=>{ showHistory(i); closeModal(); }},
      el("strong",{}, nameOf(p.by)), `${n} ${n===1?"hex":"hexes"}`, el("span",{class:"when"}, when(p.at))));
  }
  openModal("History", [histIdx !== null ? el("button",{type:"button", class:"btn", onclick:()=>{ showHistory(null); closeModal(); }}, "Back to the map now") : null, list].filter(Boolean));
};
function showHistory(i){
  histIdx = i;
  if (i === null){ histState = null; $("histBanner").hidden = true; }
  else { histState = fold(posts.slice(0,i+1)); const p = posts[i]; $("histText").textContent = `After ${nameOf(p.by)}'s post · ${when(p.at)}. Outlined hexes changed.`; $("histBanner").hidden = false; }
  moveState = null; renderSheet(); renderDraftBar(); draw();
}
$("histBack").onclick = () => showHistory(null);

function openWorld(){
  const segs = el("div",{class:"segs"});
  for (const a of [1,2,3]) segs.append(el("button",{type:"button", class:"btn", "aria-pressed":String(age===a), disabled: !canWrite || null, onclick: async ()=>{ age=a; renderAge(); closeModal(); if (db) try { await db.doc("world/meta").set({age, cols:COLS, rows:ROWS}); } catch(e){ toast("Couldn't save the age."); } }}, AGES[a][0]));
  let cols = COLS, rows = ROWS;
  const ci = el("input",{id:"cols", type:"number", min:"4", max:"80", value:String(COLS), inputmode:"numeric"}); ci.oninput = () => cols = +ci.value;
  const ri = el("input",{id:"rows", type:"number", min:"4", max:"120", value:String(ROWS), inputmode:"numeric"}); ri.oninput = () => rows = +ri.value;
  const size = el("form",{class:"form", onsubmit: async (e)=>{ e.preventDefault(); if (!(cols>=4 && cols<=80 && rows>=4 && rows<=120)) { toast("Use 4 to 80 across and 4 to 120 down."); return; } COLS=cols; ROWS=rows; fit(); closeModal(); if (db) try { await db.doc("world/meta").set({age, cols, rows}); } catch(e){} }},
    el("label",{for:"cols"},"Hexes across"), ci, el("label",{for:"rows"},"Hexes down"), ri,
    el("p",{class:"note"},"The default is 32 across and 53 down. Shrinking hides hexes outside the new edge; it doesn't erase them."),
    canWrite ? el("div",{class:"row"}, el("button",{type:"submit", class:"btn primary"},"Change size")) : null);
  openModal("The world", [el("p",{class:"sub"},"Current age"), segs, el("p",{class:"note"}, `In the ${AGES[age][0].toLowerCase()}, one area is ${AGES[age][1]} ${AGES[age][1]===1?"hex":"hexes"}.`), el("p",{class:"sub"},"Map size"), size]);
};
function renderAge(){ $("ageLabel").textContent = `${AGES[age][0]} · area ${AGES[age][1]}`; }
$("menuBtn").onclick = () => {
  const item = (title, sub, fn) => el("button",{type:"button", class:"link", style:"min-height:60px", onclick:()=>{ closeModal(); fn(); }},
    el("span",{}, el("strong",{}, title), el("br"), el("span",{class:"note"}, sub)), el("span",{class:"when","aria-hidden":"true"}, "›"));
  openModal("Menu", [
    item("History", posts.length ? `${posts.length} published ${posts.length===1?"post":"posts"}` : "No posts yet", openHistory),
    item("Key", "What the colors and symbols mean", openKey),
    item("Age and map size", `${AGES[age][0]} · ${COLS} × ${ROWS} hexes`, openWorld)
  ]);
};

/* ================= misc ================= */
let toastT = 0;
function toast(m){ const t = $("toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(()=>t.style.opacity = 0, 2800); }
function setReadOnly(){ canWrite = false; $("hint").hidden = true; selection.clear(); renderSheet(); renderDraftBar(); }

// read-only hooks for the automated tests (tests/); nothing in the app uses them
window.__soc = {
  fold, merge, landInfo, center, edgeNeighbors, pick,
  state: () => ({ selection:[...selection], draft:Object.fromEntries(draft), base:Object.fromEntries(base), posts, age, cols:COLS, rows:ROWS, adding, sheetCat }),
  view: id => view(id)
};
window.__hexScreen = (c,r) => { const [x,y] = center(c,r); const b = canvas.getBoundingClientRect(); return [b.left + x*V.k+V.ox, b.top + y*V.k+V.oy]; }; // used by automated checks
/* ================= boot ================= */
loadDraftLocal(); renderAge(); renderDraftBar(); renderSheet();
new ResizeObserver(resize).observe(stage);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", draw);
new MutationObserver(draw).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { toast("Preview: changes aren\u2019t shared or saved yet."); return; }
  const [d, u] = await Promise.all([cl.use("db"), cl.use("user")]);
  user = u;
  if (u){ try { myId = await u.id(); } catch(e){} try { if (await u.can("data.write") === false) setReadOnly(); } catch(e){} }
  if (!d){ toast("Preview: changes aren\u2019t shared or saved yet."); return; }
  db = d;
  db.collection("posts").onSnapshot(snap => {
    posts = snap.docs.map(x => ({id:x.id, ...x.data()})).sort((a,b) => a.id < b.id ? -1 : 1);
    base = fold(posts);
    // drop draft fields that now match the shared map
    for (const [id,p] of [...draft]){ const b = base.get(id)||{}; for (const k of Object.keys(p)) if (same(b[k], p[k])) delete p[k]; if (!Object.keys(p).length) draft.delete(id); }
    if (histIdx !== null){ if (histIdx >= posts.length) showHistory(null); else histState = fold(posts.slice(0,histIdx+1)); }
    renderDraftBar(); renderSheet(); draw();
  }, () => toast("Lost connection. Reload to see new posts."));
  db.collection("types").onSnapshot(snap => {
    customLand.clear(); customNat.clear();
    for (const x of snap.docs){ const v = x.data(); if (v.kind === "land") customLand.set("x-"+x.id, {name:v.name, color:v.color||"#8f8a82", glyph:v.glyph}); else if (v.kind === "nature") customNat.add(v.name); }
    draw(); if (sheetCat) renderSheet();
  });
  db.collection("peoples").onSnapshot(snap => { peoples.clear(); for (const x of snap.docs){ const v = x.data(); peoples.set(x.id, {name:v.name, color:v.color}); } draw(); if (sheetCat) renderSheet(); });
  db.doc("world/meta").onSnapshot(s => {
    if (!s.exists) return; const v = s.data();
    if (AGES[v.age] && v.age !== age){ age = v.age; renderAge(); }
    if (v.cols && v.rows && (v.cols !== COLS || v.rows !== ROWS)){ COLS = v.cols; ROWS = v.rows; fit(); }
  });
})();
})();
</script>
