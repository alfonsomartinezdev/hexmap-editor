name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04   # the pinned Playwright browsers don't install on newer Ubuntu
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run tests on phone-sized Chromium and WebKit (Safari's engine)
        run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
